<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Experiencias Turísticas</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
    <div class="min-h-screen flex items-center justify-center p-4">
        <div class="max-w-md w-full bg-white rounded-lg shadow-xl p-8">
            <!-- Header -->
            <div class="text-center mb-8">
                <a href="index.html" class="text-2xl font-bold text-blue-600">🌍 Experiencias Turísticas</a>
                <h1 class="text-3xl font-bold text-gray-900 mt-4 mb-2">Crear cuenta</h1>
                <p class="text-gray-600">Únete a nuestra comunidad</p>
            </div>

            <!-- Mensajes de éxito -->
            <div id="successMessage" class="hidden mb-6 p-4 bg-green-50 border border-green-200 rounded-lg">
                <div class="flex items-center">
                    <svg class="w-5 h-5 text-green-500 mr-2" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
                    </svg>
                    <p class="text-green-700 text-sm" id="successText"></p>
                </div>
            </div>

            <!-- Mensajes de error -->
            <div id="errorMessage" class="hidden mb-6 p-4 bg-red-50 border border-red-200 rounded-lg">
                <div class="flex items-start">
                    <svg class="w-5 h-5 text-red-500 mr-2 mt-0.5" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
                    </svg>
                    <ul class="text-red-700 text-sm space-y-1" id="errorList"></ul>
                </div>
            </div>

            <!-- Formulario -->
            <div class="space-y-6">
                <!-- Nombre -->
                <div>
                    <label for="nombre" class="block text-sm font-medium text-gray-700 mb-1">
                        Nombre completo
                    </label>
                    <input
                        type="text"
                        id="nombre"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                        placeholder="Tu nombre"
                    />
                </div>

                <!-- Email -->
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">
                        Correo electrónico *
                    </label>
                    <input
                        type="email"
                        id="email"
                        required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                        placeholder="tu@email.com"
                    />
                </div>

                <!-- Rol -->
                <div>
                    <label for="role" class="block text-sm font-medium text-gray-700 mb-1">
                        Tipo de cuenta *
                    </label>
                    <select
                        id="role"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                    >
                        <option value="visitante">Visitante (Reservar experiencias)</option>
                        <option value="proveedor">Proveedor (Ofrecer experiencias)</option>
                    </select>
                </div>

                <!-- Contraseña -->
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">
                        Contraseña *
                    </label>
                    <input
                        type="password"
                        id="password"
                        required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                        placeholder="Mínimo 8 caracteres"
                    />
                    
                    <!-- Indicador de fortaleza -->
                    <div id="strengthIndicator" class="hidden mt-2">
                        <div class="flex items-center gap-2 mb-1">
                            <div class="flex-1 h-2 bg-gray-200 rounded-full overflow-hidden">
                                <div id="strengthBar" class="h-full transition-all duration-300 bg-red-500" style="width: 0%"></div>
                            </div>
                            <span class="text-xs text-gray-600" id="strengthLabel">Muy débil</span>
                        </div>
                        <p class="text-xs text-gray-500">
                            Debe incluir: mayúsculas, minúsculas y números
                        </p>
                    </div>
                </div>

                <!-- Confirmar contraseña -->
                <div>
                    <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-1">
                        Confirmar contraseña *
                    </label>
                    <input
                        type="password"
                        id="confirmPassword"
                        required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                        placeholder="Repite tu contraseña"
                    />
                    <p id="passwordMatchError" class="hidden mt-1 text-sm text-red-600">Las contraseñas no coinciden</p>
                </div>

                <!-- Botón submit -->
                <button
                    id="submitBtn"
                    onclick="handleSubmit()"
                    class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 focus:ring-4 focus:ring-blue-300 transition disabled:opacity-50 disabled:cursor-not-allowed"
                >
                    Crear cuenta
                </button>
            </div>

            <!-- Link a inicio -->
            <div class="mt-6 text-center">
                <p class="text-gray-600">
                    <a href="index.html" class="text-blue-600 hover:text-blue-700 font-semibold">
                        ← Volver al inicio
                    </a>
                </p>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3001/api/auth';

        // Validación de fortaleza de contraseña
        document.getElementById('password').addEventListener('input', function() {
            const password = this.value;
            const indicator = document.getElementById('strengthIndicator');
            const bar = document.getElementById('strengthBar');
            const label = document.getElementById('strengthLabel');

            if (!password) {
                indicator.classList.add('hidden');
                return;
            }

            indicator.classList.remove('hidden');
            let strength = 0;
            
            if (password.length >= 8) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[a-z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^A-Za-z0-9]/.test(password)) strength++;

            const levels = [
                { label: 'Muy débil', color: 'bg-red-500', width: '20%' },
                { label: 'Débil', color: 'bg-orange-500', width: '40%' },
                { label: 'Regular', color: 'bg-yellow-500', width: '60%' },
                { label: 'Buena', color: 'bg-blue-500', width: '80%' },
                { label: 'Fuerte', color: 'bg-green-500', width: '100%' }
            ];

            const level = levels[strength - 1] || levels[0];
            bar.className = `h-full transition-all duration-300 ${level.color}`;
            bar.style.width = level.width;
            label.textContent = level.label;
        });

        // Validar coincidencia de contraseñas
        document.getElementById('confirmPassword').addEventListener('input', function() {
            const password = document.getElementById('password').value;
            const confirmPassword = this.value;
            const error = document.getElementById('passwordMatchError');

            if (confirmPassword && password !== confirmPassword) {
                error.classList.remove('hidden');
            } else {
                error.classList.add('hidden');
            }
        });

        // Validar contraseña según criterios
        function validatePassword(password) {
            const errors = [];
            if (password.length < 8) {
                errors.push('La contraseña debe tener al menos 8 caracteres');
            }
            if (!/[A-Z]/.test(password)) {
                errors.push('Debe incluir al menos una letra mayúscula');
            }
            if (!/[a-z]/.test(password)) {
                errors.push('Debe incluir al menos una letra minúscula');
            }
            if (!/[0-9]/.test(password)) {
                errors.push('Debe incluir al menos un número');
            }
            return errors;
        }

        // Mostrar errores
        function showErrors(errors) {
            const errorDiv = document.getElementById('errorMessage');
            const errorList = document.getElementById('errorList');
            const successDiv = document.getElementById('successMessage');

            successDiv.classList.add('hidden');
            errorList.innerHTML = errors.map(err => `<li>${err}</li>`).join('');
            errorDiv.classList.remove('hidden');
        }

        // Mostrar éxito
        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            const successText = document.getElementById('successText');
            const errorDiv = document.getElementById('errorMessage');

            errorDiv.classList.add('hidden');
            successText.textContent = message;
            successDiv.classList.remove('hidden');
        }

        // Manejar submit
        async function handleSubmit() {
            const submitBtn = document.getElementById('submitBtn');
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const role = document.getElementById('role').value;
            const nombre = document.getElementById('nombre').value;

            // Validaciones del cliente
            const passwordErrors = validatePassword(password);
            if (passwordErrors.length > 0) {
                showErrors(passwordErrors);
                return;
            }

            if (password !== confirmPassword) {
                showErrors(['Las contraseñas no coinciden']);
                return;
            }

            // Deshabilitar botón
            submitBtn.disabled = true;
            submitBtn.innerHTML = `
                <span class="flex items-center justify-center">
                    <svg class="animate-spin h-5 w-5 mr-2" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none" />
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" />
                    </svg>
                    Registrando...
                </span>
            `;

            try {
                const response = await fetch(`${API_URL}/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email,
                        password,
                        confirmPassword,
                        role,
                        nombre
                    })
                });

                const data = await response.json();

                if (data.success) {
                    showSuccess(data.message + ' ¡Ahora puedes iniciar sesión!');
                    // Limpiar formulario
                    setTimeout(() => {
                        document.getElementById('email').value = '';
                        document.getElementById('password').value = '';
                        document.getElementById('confirmPassword').value = '';
                        document.getElementById('nombre').value = '';
                        document.getElementById('strengthIndicator').classList.add('hidden');
                    }, 2000);
                } else {
                    if (data.errors && Array.isArray(data.errors)) {
                        showErrors(data.errors.map(err => err.message));
                    } else {
                        showErrors([data.message || 'Error al registrar usuario']);
                    }
                }
            } catch (error) {
                console.error('Error:', error);
                showErrors(['Error de conexión. Verifica que el servidor esté corriendo en http://localhost:3001']);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Crear cuenta';
            }
        }

        // Enter para enviar
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                handleSubmit();
            }
        });
    </script>
</body>
</html>

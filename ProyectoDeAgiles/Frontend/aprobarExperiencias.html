<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pantalla de Gestión de Experiencias</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f3f3f3;
        margin: 0;
        padding: 20px;
    }

    h1 {
        text-align: center;
    }

    .table-container {
        background: #fff;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        max-width: 1100px;
        margin: auto;
    }

    table {
        width: 100%;
        border-collapse: collapse;
    }

    th, td {
        padding: 14px;
        border-bottom: 1px solid #ddd;
        text-align: left;
    }

    th {
        background: #fafafa;
    }

    .btn {
        padding: 7px 12px;
        border: none;
        border-radius: 6px;
        color: white;
        cursor: pointer;
        font-size: 14px;
    }

    .btn-view { background: #007bff; }
    .btn-approve { background: #28a745; }
    .btn-reject { background: #dc3545; }

    .btn-view:hover { background: #0069d9; }
    .btn-approve:hover { background: #218838; }
    .btn-reject:hover { background: #c82333; }

    .status {
        font-weight: bold;
        padding: 4px 8px;
        border-radius: 6px;
        color: white;
    }

    .pending { background: #ffc107; color: #000; }
    .approved { background: #28a745; }
    .rejected { background: #dc3545; }

    /* Modal base */
    .modal-bg {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0,0,0,0.5);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 10;
    }

    .modal {
        background: #fff;
        padding: 20px;
        width: 420px;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .modal textarea {
        width: 100%;
        height: 80px;
        padding: 8px;
        border-radius: 6px;
        border: 1px solid #ccc;
    }

    .modal-btns {
        text-align: right;
        margin-top: 10px;
    }

    .btn-cancel {
        background: #6c757d;
        padding: 7px 12px;
        color: white;
        border-radius: 6px;
        border: none;
        cursor: pointer;
    }

    .btn-save {
        background: #dc3545;
        padding: 7px 12px;
        color: white;
        border-radius: 6px;
        border: none;
        cursor: pointer;
        margin-left: 5px;
    }

    /* Modal detalles */
    .details-item {
        margin-bottom: 8px;
    }
    .details-title {
        font-weight: bold;
        margin-bottom: 3px;
    }

</style>
</head>
<body>

<h1>Gestión de Experiencias Pendientes</h1>

<div class="table-container">
    <table>
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Proveedor</th>
                <th>Fecha</th>
                <th>Precio</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
        </thead>

        <tbody id="experienceTable">
        </tbody>
    </table>
</div>

<!-- MODAL DETALLES -->
<div class="modal-bg" id="detailsModal">
    <div class="modal">
        <h3>Detalles de la Experiencia</h3>
        <div id="detailsContent"></div>
        <div class="modal-btns">
            <button class="btn-cancel" onclick="closeDetails()">Cerrar</button>
        </div>
    </div>
</div>

<!-- MODAL RECHAZO -->
<div class="modal-bg" id="rejectModal">
    <div class="modal">
        <h3>Razón de rechazo</h3>
        <textarea id="rejectReason" placeholder="Escribe la razón..."></textarea>
        <div class="modal-btns">
            <button class="btn-cancel" onclick="closeRejectModal()">Cancelar</button>
            <button class="btn-save" onclick="saveRejection()">Rechazar</button>
        </div>
    </div>
</div>

<script>
let currentRejectId = null;

// EXPERIENCIAS DE PROVEEDORES
const experiences = [
    {
        id: 1,
        nombre: "Tour por el desierto",
        descripcion: "Experiencia guiada a través de dunas desérticas.",
        precio: 1500,
        fecha: "2025-11-10",
        cupo: 12,
        ubicacion: "Chihuahua, MX",
        categoria: "Aventura",
        proveedor: "Aventura MX",
        estado: "Pendiente"
    },
    {
        id: 2,
        nombre: "Clase de cocina regional",
        descripcion: "Aprende platillos tradicionales con un chef local.",
        precio: 900,
        fecha: "2025-11-08",
        cupo: 8,
        ubicacion: "Oaxaca, MX",
        categoria: "Gastronomía",
        proveedor: "Sazón Gourmet",
        estado: "Pendiente"
    }
];

// Renderización inicial
function renderTable() {
    const table = document.getElementById("experienceTable");
    table.innerHTML = "";

    experiences.forEach(e => {
        table.innerHTML += `
            <tr data-id="${e.id}">
                <td>${e.nombre}</td>
                <td>${e.proveedor}</td>
                <td>${e.fecha}</td>
                <td>$${e.precio}</td>
                <td><span class="status ${e.estado === 'Pendiente' ? 'pending' : e.estado === 'Aprobada' ? 'approved' : 'rejected'}">
                    ${e.estado}
                </span></td>
                <td>
                    <button class="btn btn-view" onclick="showDetails(${e.id})">Ver detalles</button>
                    <button class="btn btn-approve" onclick="approve(${e.id})">Aprobar</button>
                    <button class="btn btn-reject" onclick="openRejectModal(${e.id})">Rechazar</button>
                </td>
            </tr>
        `;
    });
}

renderTable();

// MODAL DETALLES
function showDetails(id) {
    const e = experiences.find(x => x.id === id);

    document.getElementById("detailsContent").innerHTML = `
        <div class="details-item"><span class="details-title">Nombre:</span> ${e.nombre}</div>
        <div class="details-item"><span class="details-title">Descripción:</span> ${e.descripcion}</div>
        <div class="details-item"><span class="details-title">Precio:</span> $${e.precio}</div>
        <div class="details-item"><span class="details-title">Fecha:</span> ${e.fecha}</div>
        <div class="details-item"><span class="details-title">Cupo máximo:</span> ${e.cupo}</div>
        <div class="details-item"><span class="details-title">Ubicación:</span> ${e.ubicacion}</div>
        <div class="details-item"><span class="details-title">Categoría:</span> ${e.categoria}</div>
        <div class="details-item"><span class="details-title">Proveedor:</span> ${e.proveedor}</div>
    `;

    document.getElementById("detailsModal").style.display = "flex";
}

function closeDetails() {
    document.getElementById("detailsModal").style.display = "none";
}

// APROBAR
function approve(id) {
    const e = experiences.find(x => x.id === id);
    e.estado = "Aprobada";

    alert("Notificación enviada al proveedor: La experiencia fue aprobada.");

    renderTable();
}

// RECHAZAR
function openRejectModal(id) {
    currentRejectId = id;
    document.getElementById("rejectModal").style.display = "flex";
}

function closeRejectModal() {
    document.getElementById("rejectReason").value = "";
    document.getElementById("rejectModal").style.display = "none";
}

function saveRejection() {
    const reason = document.getElementById("rejectReason").value.trim();
    if (!reason) {
        alert("Debes ingresar una razón obligatoria.");
        return;
    }

    const e = experiences.find(x => x.id === currentRejectId);
    e.estado = "Rechazada";

    alert("Notificación enviada al proveedor.\nRazón: " + reason);

    closeRejectModal();
    renderTable();
}
</script>

</body>
</html>

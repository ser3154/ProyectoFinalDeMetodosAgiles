<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Crear experiencia - Proveedor | Experiencias Turísticas</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
        <nav class="bg-white shadow">
            <div
                class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center"
            >
                <div class="text-2xl font-bold text-blue-600">
                    🌍 Experiencias Turísticas
                </div>
                <div class="flex gap-3">
                    <a
                        href="mis-experiencias.html"
                        class="text-sm px-3 py-2 bg-white border border-blue-600 text-blue-600 rounded-lg hover:bg-blue-50"
                        >Mis experiencias</a
                    >
                    <a href="index.html" class="text-sm px-3 py-2 text-gray-600"
                        >Inicio</a
                    >
                </div>
            </div>
        </nav>

        <main class="max-w-3xl mx-auto p-6">
            <div class="bg-white rounded-xl shadow p-6">
                <h1 class="text-2xl font-bold text-gray-900 mb-4">
                    Crear nueva experiencia
                </h1>
                <p class="text-sm text-gray-600 mb-6">
                    Completa los datos para publicar una experiencia.
                </p>

                <div id="msg" class="hidden mb-4"></div>

                <form id="form" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium">Nombre</label>
                        <input
                            id="nombre"
                            name="nombre"
                            type="text"
                            class="mt-1 block w-full rounded-md border px-3 py-2"
                            placeholder="Nombre de la experiencia"
                            required
                        />
                    </div>

                    <div>
                        <label class="block text-sm font-medium"
                            >Descripción</label
                        >
                        <textarea
                            id="descripcion"
                            name="descripcion"
                            rows="4"
                            class="mt-1 block w-full rounded-md border px-3 py-2"
                            placeholder="Describe la experiencia"
                            required
                        ></textarea>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium"
                                >Precio (MXN)</label
                            >
                            <input
                                id="precio"
                                name="precio"
                                type="number"
                                step="0.01"
                                min="0"
                                class="mt-1 block w-full rounded-md border px-3 py-2"
                                placeholder="250.00"
                                required
                            />
                        </div>
                        <div>
                            <label class="block text-sm font-medium"
                                >Fecha y hora</label
                            >
                            <input
                                id="fecha"
                                name="fecha"
                                type="datetime-local"
                                class="mt-1 block w-full rounded-md border px-3 py-2"
                                required
                            />
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium"
                                >Ubicación</label
                            >
                            <input
                                id="ubicacion"
                                name="ubicacion"
                                type="text"
                                class="mt-1 block w-full rounded-md border px-3 py-2"
                                placeholder="Ciudad, Estado"
                                required
                            />
                        </div>
                        <div>
                            <label class="block text-sm font-medium"
                                >Cupo</label
                            >
                            <input
                                id="cupo"
                                name="cupo"
                                type="number"
                                min="1"
                                step="1"
                                class="mt-1 block w-full rounded-md border px-3 py-2"
                                value="10"
                                required
                            />
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium"
                            >Imágenes (máx 3, 5MB cada una)</label
                        >
                        <input
                            id="imagenes"
                            name="images"
                            type="file"
                            accept="image/*"
                            multiple
                            class="mt-1 block w-full"
                        />
                        <p class="text-xs text-gray-500 mt-1">
                            Formatos permitidos: jpg, png, webp.
                        </p>

                        <div
                            id="preview"
                            class="mt-3 grid grid-cols-3 gap-3"
                        ></div>
                    </div>

                    <div class="pt-4">
                        <button
                            id="submitBtn"
                            type="button"
                            class="w-full bg-blue-600 text-white px-4 py-3 rounded-lg font-semibold hover:bg-blue-700 disabled:opacity-60"
                        >
                            Publicar experiencia
                        </button>
                    </div>
                </form>
            </div>
        </main>

        <script src="js/api.js"></script>
        <script>
            const MAX_FILES = 3;
            const MAX_SIZE = 5 * 1024 * 1024; // 5MB
            const input = document.getElementById("imagenes");
            const preview = document.getElementById("preview");
            const msg = document.getElementById("msg");

            function showMessage(text, type = "success") {
                msg.className = "";
                msg.classList.remove("hidden");
                msg.classList.add("mb-4", "p-3", "rounded-md");
                if (type === "success") {
                    msg.classList.add(
                        "bg-green-50",
                        "border",
                        "border-green-200",
                        "text-green-700",
                    );
                } else {
                    msg.classList.add(
                        "bg-red-50",
                        "border",
                        "border-red-200",
                        "text-red-700",
                    );
                }
                msg.textContent = text;
                setTimeout(() => msg.classList.add("hidden"), 6000);
            }

            input.addEventListener("change", () => {
                preview.innerHTML = "";
                const files = Array.from(input.files || []);
                if (files.length > MAX_FILES) {
                    showMessage(
                        `Selecciona máximo ${MAX_FILES} imágenes`,
                        "error",
                    );
                    input.value = "";
                    return;
                }
                for (const f of files) {
                    if (f.size > MAX_SIZE) {
                        showMessage(
                            `El archivo "${f.name}" supera 5MB`,
                            "error",
                        );
                        input.value = "";
                        preview.innerHTML = "";
                        return;
                    }
                }

                files.forEach((file) => {
                    const url = URL.createObjectURL(file);
                    const img = document.createElement("img");
                    img.src = url;
                    img.className = "w-full h-32 object-cover rounded-md";
                    const wrapper = document.createElement("div");
                    wrapper.appendChild(img);
                    preview.appendChild(wrapper);
                });
            });

            document
                .getElementById("submitBtn")
                .addEventListener("click", async () => {
                    const btn = document.getElementById("submitBtn");
                    btn.disabled = true;
                    btn.textContent = "Publicando...";

                    // gather fields
                    const nombre = document
                        .getElementById("nombre")
                        .value.trim();
                    const descripcion = document
                        .getElementById("descripcion")
                        .value.trim();
                    const precio = document.getElementById("precio").value;
                    const fecha = document.getElementById("fecha").value;
                    const ubicacion = document
                        .getElementById("ubicacion")
                        .value.trim();
                    const cupo = document.getElementById("cupo").value;
                    const files = Array.from(
                        document.getElementById("imagenes").files || [],
                    );

                    // basic client-side validation
                    if (
                        !nombre ||
                        !descripcion ||
                        !precio ||
                        !fecha ||
                        !ubicacion ||
                        !cupo
                    ) {
                        showMessage(
                            "Completa todos los campos requeridos",
                            "error",
                        );
                        btn.disabled = false;
                        btn.textContent = "Publicar experiencia";
                        return;
                    }

                    if (files.length > MAX_FILES) {
                        showMessage(
                            `Máximo ${MAX_FILES} imágenes permitidas`,
                            "error",
                        );
                        btn.disabled = false;
                        btn.textContent = "Publicar experiencia";
                        return;
                    }

                    const userString = localStorage.getItem("user");
                    if (!userString) {
                        window.location.href = "login.html";
                    }
                    const usuarioObj = JSON.parse(userString);

                    const formData = new FormData();
                    formData.append("nombre", nombre);
                    formData.append("descripcion", descripcion);
                    formData.append("precio", precio);
                    formData.append("fecha", new Date(fecha).toISOString());
                    formData.append("ubicacion", ubicacion);
                    formData.append("cupo", cupo);
                    formData.append("estado", "REVISION_PENDIENTE");
                    formData.append("proveedorId", usuarioObj.id);

                    console.log(JSON.stringify(formData, null, 2));

                    files.forEach((f) => formData.append("fotos", f));

                    console.log(JSON.stringify(formData, null, 2));
                    try {
                        const res = await API.createExperiencia(formData);
                        if (res.ok) {
                            const data = await res.json();
                            showMessage(
                                "Experiencia publicada correctamente",
                                "success",
                            );
                            // reset form
                            document.getElementById("form").reset();
                            preview.innerHTML = "";
                        } else {
                            let errText = `Error ${res.status}`;
                            try {
                                const body = await res.json();
                                if (body && body.errors) {
                                    if (Array.isArray(body.errors)) {
                                        errText = body.errors
                                            .map((e) => e.msg || e.message || e)
                                            .join("; ");
                                    } else {
                                        errText =
                                            body.message ||
                                            JSON.stringify(body);
                                    }
                                } else if (body && body.message) {
                                    errText = body.message;
                                }
                            } catch (e) {}
                            showMessage(errText, "error");
                        }
                    } catch (e) {
                        showMessage(
                            "Error de conexión. ¿El servidor está corriendo?",
                            "error",
                        );
                    } finally {
                        btn.disabled = false;
                        btn.textContent = "Publicar experiencia";
                    }
                });
        </script>
    </body>
</html>

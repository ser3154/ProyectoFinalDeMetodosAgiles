<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Experiencias Turísticas</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
    <div class="min-h-screen flex items-center justify-center p-4">
        <div class="max-w-md w-full bg-white rounded-lg shadow-xl p-8">
            
            <!-- Header -->
            <div class="text-center mb-8">
                <a href="index.html" class="text-2xl font-bold text-blue-600">🌍 Experiencias Turísticas</a>
                <h1 class="text-3xl font-bold text-gray-900 mt-4 mb-2">Iniciar sesión</h1>
                <p class="text-gray-600">Accede a tu cuenta</p>
            </div>

            <!-- Mensaje de éxito -->
            <div id="successMessage" class="hidden mb-6 p-4 bg-green-50 border border-green-200 rounded-lg">
                <div class="flex items-center">
                    <svg class="w-5 h-5 text-green-500 mr-2" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
                    </svg>
                    <p class="text-green-700 text-sm" id="successText"></p>
                </div>
            </div>

            <!-- Mensajes de error -->
            <div id="errorMessage" class="hidden mb-6 p-4 bg-red-50 border border-red-200 rounded-lg">
                <div class="flex items-start">
                    <svg class="w-5 h-5 text-red-500 mr-2 mt-0.5" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
                    </svg>
                    <ul class="text-red-700 text-sm space-y-1" id="errorList"></ul>
                </div>
            </div>

            <!-- Formulario -->
            <div class="space-y-6">
                
                <!-- Email -->
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Correo electrónico *</label>
                    <input
                        type="email"
                        id="email"
                        required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                        placeholder="tu@email.com"
                    />
                </div>

                <!-- Password -->
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Contraseña *</label>
                    <input
                        type="password"
                        id="password"
                        required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                        placeholder="Tu contraseña"
                    />
                </div>

                <!-- Botón -->
                <button
                    id="submitBtn"
                    onclick="handleLogin()"
                    class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 focus:ring-4 focus:ring-blue-300 transition disabled:opacity-50 disabled:cursor-not-allowed"
                >
                    Iniciar sesión
                </button>
            </div>

            <!-- Link -->
            <div class="mt-6 text-center">
                <p class="text-gray-600">
                    ¿No tienes cuenta?
                    <a href="registrer.html" class="text-blue-600 hover:text-blue-700 font-semibold">
                        Crear una cuenta →
                    </a>
                </p>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3001/api/auth';

        // errores
        function showErrors(errors) {
            const errorDiv = document.getElementById('errorMessage');
            const errorList = document.getElementById('errorList');
            const successDiv = document.getElementById('successMessage');

            successDiv.classList.add('hidden');
            errorList.innerHTML = errors.map(err => `<li>${err}</li>`).join('');
            errorDiv.classList.remove('hidden');
        }

        // exitos
        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            const successText = document.getElementById('successText');
            const errorDiv = document.getElementById('errorMessage');

            errorDiv.classList.add('hidden');
            successText.textContent = message;
            successDiv.classList.remove('hidden');
        }

        // login
        async function handleLogin() {
            const submitBtn = document.getElementById('submitBtn');
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                showErrors(['Todos los campos son obligatorios']);
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = `
                <span class="flex items-center justify-center">
                    <svg class="animate-spin h-5 w-5 mr-2" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none" />
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" />
                    </svg>
                    Iniciando...
                </span>
            `;

            try {
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                /*
                localStorage.setItem("token", result.data.token);
                */

                if (data.success) {
                    showSuccess('Inicio de sesión exitoso 🎉');

                    // guardar token en localStorage
                    localStorage.setItem('token', data.data.token);
                    localStorage.setItem('user', JSON.stringify(data.data.user));

                    // redireccion
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1500);

                } else {
                    showErrors([data.message || 'Credenciales inválidas']);
                }

            } catch (error) {
                console.error(error);
                showErrors(['Error al conectar con el servidor']);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Iniciar sesión';
            }
        }

        // enter para enviar
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') handleLogin();
        });
    </script>
</body>
</html>
